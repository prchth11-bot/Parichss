<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นักวิ่งพิชิตชัย</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Mitr:wght@600;700&display=swap');*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Kanit,sans-serif;color:#14275b;background:#18255b;touch-action:manipulation}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;padding:16px;pointer-events:none;display:flex;justify-content:space-between;flex-direction:column}.top{display:flex;justify-content:space-between}.title{font:700 clamp(21px,3vw,35px) Mitr;color:white;text-shadow:0 3px #25206b}.pill,.system{background:#fffdf7e9;border:2px solid #fff;border-radius:16px;padding:7px 12px;font-weight:700;box-shadow:0 4px #253b7933}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.system{align-self:center;text-align:center;width:min(720px,94vw)}.parts{margin-top:5px}.part{display:inline-block;margin:2px;padding:2px 7px;border-radius:8px;background:#e5e8fb;color:#687294;font-size:12px}.part.on{color:white;background:var(--c)}button{font:700 16px Kanit;border:0;border-radius:14px;padding:10px 15px;cursor:pointer}.bar{pointer-events:auto;text-align:center}.bar button{background:#263f8c;color:white;border:1px solid #fff8}.mobile{display:none}.modal{position:fixed;inset:0;z-index:4;background:#121a48b8;display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px)}.card{background:linear-gradient(145deg,#fffefa,#e8e6ff);border:4px solid white;border-radius:28px;padding:clamp(22px,4vw,38px);width:min(92vw,620px);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 16px #101b4d70}.card h1,.card h2{font-family:Mitr;color:#5634c5;margin:0}.card h1{font-size:clamp(31px,5vw,50px)}.logo{font-size:55px}.tip,.learn{background:white;border-radius:14px;padding:12px;margin:15px 0;text-align:left;line-height:1.6}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.level{background:white;border:2px solid #d5dafa;color:#27366e;box-shadow:none;font-size:13px}.level.on{background:#e9e1ff;border-color:#6647d9}.primary{background:linear-gradient(#ff73ad,#e63d82);color:white;box-shadow:0 5px #a91d5a;margin-top:10px}.answers{display:grid;gap:8px;margin:16px 0}.answer{background:white;color:#283865;border:2px solid #dce2f8;box-shadow:0 3px #c0c9e9}.hidden{display:none!important}.toast{position:fixed;z-index:3;top:18%;left:50%;transform:translateX(-50%);max-width:90vw;text-align:center;background:#fffef5;border:3px solid white;border-radius:16px;padding:9px 16px;font-weight:600;box-shadow:0 5px #2a3d7233}.toast b{display:block;color:#5634c5;font-size:18px}.mute{position:fixed;right:14px;bottom:14px;z-index:3;border-radius:50%;background:#253f8b;color:white;border:2px solid white;width:43px;height:43px;padding:0}@media(max-width:650px){.mobile{display:inline-block}.desktop{display:none}.title{font-size:20px}.stats{max-width:55vw}.levels{grid-template-columns:1fr}.hud{padding:10px}.system{font-size:13px}.bar{margin-bottom:6px}}</style></head>
<body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="title">นักวิ่งพิชิตชัย</div><div class="stats"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">📏 <span id="dist">0</span> ม.</div><div class="pill">❤️ <span id="life">3</span></div></div></div><div class="system"><span id="mission">เลือกด่านเพื่อเริ่ม</span><div class="parts" id="parts"></div></div><div class="bar"><button class="desktop" id="jump">Space / ↑ กระโดด</button><button class="desktop" id="slide">↓ สไลด์</button><button id="pause">⏸ หยุดเกม</button><button class="mobile" id="ms">⬇️</button><button class="mobile" id="mj">⬆️</button></div></div><button class="mute" id="mute">🔊</button><div id="toast" class="toast hidden"></div>
<div class="modal" id="start"><div class="card"><div class="logo">🏃‍♀️⚙️</div><h1>นักวิ่งพิชิตชัย</h1><h2>ระบบทางเทคโนโลยี</h2><p>วิ่ง เก็บความรู้ และสร้างระบบให้สำเร็จ!</p><div class="tip">เก็บตามลำดับ <b>Input → Process → Output → Feedback</b><br>กด Space/↑ เพื่อกระโดดได้ 2 ชั้น และ ↓ เพื่อสไลด์</div><div id="levels" class="levels"></div><button class="primary" id="play">เริ่มภารกิจ!</button><p>คะแนนสูงสุด: <b id="high">0</b></p></div></div>
<div class="modal hidden" id="quiz"><div class="card"><div>🧠 คำถามทบทวน</div><h2 id="q"></h2><div id="answers" class="answers"></div><div id="explain"></div><button class="primary hidden" id="go">วิ่งต่อ!</button></div></div><div class="modal hidden" id="paused"><div class="card"><div class="logo">⏸️</div><h2>พักหายใจก่อน</h2><button class="primary" id="resume">เล่นต่อ</button></div></div><div class="modal hidden" id="result"><div class="card"><div class="logo" id="icon">🏆</div><h2 id="rtitle"></h2><p id="rtext"></p><div class="learn" id="learn"></div><button class="primary" id="again">เล่นอีกครั้ง</button></div></div>
<script>
(()=>{'use strict';const C=document.querySelector('#c'),x=C.getContext('2d'),$=s=>document.querySelector(s),parts=[['Input','ตัวป้อน','#2696ec','▣','วัตถุดิบ ข้อมูล หรือพลังงาน'],['Process','กระบวนการ','#ff963f','⚙','ขั้นตอนการทำงาน'],['Output','ผลผลิต','#31bd73','✦','ผลลัพธ์จากระบบ'],['Feedback','ข้อมูลย้อนกลับ','#a153e7','↻','ข้อมูลเพื่อปรับปรุงระบบ']];
const levels=[['ด่าน 1: ระบบไฟฉาย','ระบบไฟฉาย',['ถ่านไฟฉาย','กระแสไฟฟ้าไหลผ่านวงจร','หลอดไฟสว่าง','ตรวจสอบความสว่างและเปลี่ยนถ่าน']],['ด่าน 2: สวนอัจฉริยะ','ระบบรดน้ำต้นไม้อัตโนมัติ',['น้ำ พลังงาน และข้อมูลความชื้น','เซนเซอร์สั่งงานปั๊มน้ำ','ต้นไม้ได้รับน้ำ','ตรวจความชื้นแล้วปรับปริมาณน้ำ']],['ด่าน 3: น้ำสะอาด','ระบบผลิตน้ำดื่มสะอาด',['น้ำดิบและพลังงาน','กรองและฆ่าเชื้อ','น้ำสะอาด','ตรวจคุณภาพน้ำเพื่อปรับปรุงการกรอง']]];
const qs=[['ข้อใดคือ Input ของระบบไฟฉาย?',['ถ่านไฟฉาย','แสงจากหลอดไฟ','การตรวจสอบความสว่าง'],'ถ่านไฟฉาย','ถ่านไฟฉายคือพลังงานที่ป้อนเข้าสู่ระบบ'],['กระแสไฟฟ้าไหลผ่านวงจรคืออะไร?',['Feedback','Process','Output'],'Process','เป็นกระบวนการที่ทำให้เกิดผลลัพธ์'],['หลอดไฟสว่างคือส่วนใด?',['Input','Output','Feedback'],'Output','แสงสว่างคือผลผลิตของระบบไฟฉาย'],['ข้อมูลย้อนกลับมีหน้าที่ใด?',['ตรวจสอบและปรับปรุง','เป็นวัตถุดิบ','เป็นผลลัพธ์'],'ตรวจสอบและปรับปรุง','Feedback ช่วยให้ระบบพัฒนาได้'],['ข้อใดเป็น Input ของระบบรดน้ำ?',['ข้อมูลความชื้น','ต้นไม้ได้รับน้ำ','ปั๊มน้ำทำงาน'],'ข้อมูลความชื้น','เป็นข้อมูลที่ระบบรับเข้า'],['เซนเซอร์สั่งปั๊มน้ำเป็นส่วนใด?',['Process','Output','Feedback'],'Process','เป็นขั้นตอนการทำงานของระบบ'],['น้ำที่ผ่านการกรองแล้วคือ?',['Input','Output','Feedback'],'Output','น้ำสะอาดเป็นผลผลิตของระบบ'],['การตรวจคุณภาพน้ำคือ?',['Input','Feedback','Process'],'Feedback','ใช้เพื่อปรับปรุงการกรอง'],['ลำดับที่ถูกต้องคือ?',['Input → Process → Output → Feedback','Output → Input → Process → Feedback','Process → Output → Input → Feedback'],'Input → Process → Output → Feedback','เริ่มจากตัวป้อน ผ่านกระบวนการ เกิดผลผลิต แล้วปรับปรุง'],['ข้อใดเป็น Output?',['ผลลัพธ์ที่ระบบสร้าง','ข้อมูลเริ่มต้น','การตรวจสอบ'],'ผลลัพธ์ที่ระบบสร้าง','Output คือผลผลิตจากการทำงาน']];
let W,H,D=1,g,es=[],pt=[],last=0,raf=0,select=0,muted=false,ac;function rs(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();const ground=()=>H*.78;
function levelsUI(){$('#levels').innerHTML=levels.map((l,i)=>'<button class="level '+(i==select?'on':'')+'" data-i="'+i+'">'+l[0]+'<br><small>'+l[1]+'</small></button>').join('');document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{select=+b.dataset.i;levelsUI()})}function newGame(){g={run:false,pause:false,lvl:select,score:0,dist:0,life:3,seq:0,done:0,correct:0,shield:0,speed:285,card:0,obs:1.8,p:{x:W*.17,y:0,w:58,h:78,vy:0,j:0,slide:0}};g.p.y=ground()-g.p.h;es=[];pt=[];ui()}
function ui(){$('#score').textContent=g.score;$('#dist').textContent=Math.floor(g.dist);$('#life').textContent='❤'.repeat(g.life)+'♡'.repeat(3-g.life);$('#mission').textContent=levels[g.lvl][0]+' · เก็บ '+parts[g.seq][0];$('#parts').innerHTML=parts.map((p,i)=>'<span class="part '+(i==g.seq?'on':'')+'" style="--c:'+p[2]+'">'+p[3]+' '+p[0]+'</span>').join('')}function note(a,b){let t=$('#toast');t.innerHTML='<b>'+a+'</b>'+b;t.classList.remove('hidden');clearTimeout(note.t);note.t=setTimeout(()=>t.classList.add('hidden'),1700)}function snd(f,d=.1){if(muted)return;try{ac??=new AudioContext;let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.setValueAtTime(.06,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function burst(X,Y,c,n=12){for(let i=0;i<n;i++)pt.push({x:X,y:Y,vx:(Math.random()-.5)*230,vy:(Math.random()-.6)*250,l:.6,c})}function start(){newGame();$('#start').classList.add('hidden');g.run=true;last=performance.now();raf=requestAnimationFrame(loop);note('เริ่มภารกิจ!','เก็บ Input ก่อนนะ')}function jump(){if(!g?.run||g.pause)return;if(g.p.j<2&&!g.p.slide){g.p.vy=g.p.j?-620:-740;g.p.j++;snd(430+g.p.j*120)}}function slide(a=true){if(g?.run&&!g.pause)g.p.slide=a?.35:0}function pause(){if(!g?.run)return;g.pause=!g.pause;$('#paused').classList.toggle('hidden',!g.pause);if(!g.pause){last=performance.now();raf=requestAnimationFrame(loop)}}
function card(){let want=parts[g.seq],other=parts.filter((_,i)=>i!=g.seq),a=[want,other[(Math.random()*3)|0],other[(Math.random()*3)|0]].sort(()=>Math.random()-.5);a.forEach((p,i)=>es.push({t:'card',p,x:W+80+i*(170+Math.random()*30),y:H*(.28+Math.random()*.26),w:142,h:66,ph:Math.random()*6}))}function obstacle(){let high=Math.random()<.42;es.push({t:high?'drone':'box',x:W+70,y:high?ground()-140:ground()-48,w:high?75:55,h:high?35:48})}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function take(e){e.dead=1;if(e.p===parts[g.seq]){g.score+=100;burst(e.x+70,e.y,e.p[2],18);snd(760);note('เก็บได้ถูกต้อง!',e.p[0]+': '+e.p[4]);if(++g.seq==4){g.seq=0;g.done++;g.score+=250;note('สร้างระบบสำเร็จ!','โบนัส +250 คะแนน');setTimeout(quiz,650)}}else{g.score=Math.max(0,g.score-25);note('ลองคิดลำดับอีกครั้ง','ต้องเก็บ '+parts[g.seq][0]+' ก่อน');snd(150)}ui()}function hurt(e){e.dead=1;if(g.shield){g.shield=0;note('เกราะป้องกันทำงาน!','รอดแล้ว');return}if(--g.life<1)setTimeout(()=>finish(false),200);snd(110,.22);note('โอ๊ะ! ชนอุปสรรค','เสียพลังชีวิต 1 ดวง');ui()}
function quiz(){if(!g.run)return;g.run=false;let q=qs[(Math.random()*qs.length)|0];$('#q').textContent=q[0];$('#explain').textContent='';$('#go').classList.add('hidden');$('#answers').innerHTML='';q[1].sort(()=>Math.random()-.5).forEach(a=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>{[...$('#answers').children].forEach(z=>z.disabled=true);if(a==q[2]){g.score+=150;g.correct++;g.shield=1;b.style.background='#dff8e9';$('#explain').textContent='✓ ถูกต้อง! '+q[3]+' ได้เกราะป้องกัน 1 ครั้ง';snd(850)}else{$('#explain').textContent='คำตอบ: '+q[2]+' — '+q[3]}ui();$('#go').classList.remove('hidden')};$('#answers').append(b)});$('#quiz').classList.remove('hidden')}function finish(win){g.run=false;let h=Math.max(+localStorage.techRunnerHigh||0,g.score);localStorage.techRunnerHigh=h;$('#high').textContent=h;$('#result').classList.remove('hidden');$('#icon').textContent=win?'🏆':'💪';$('#rtitle').textContent=win?'ภารกิจสำเร็จ!':'ลองใหม่ได้เลย!';$('#rtext').textContent=win?'คุณช่วยให้'+levels[g.lvl][1]+'ทำงานได้สมบูรณ์ ได้ '+g.score+' คะแนน':'ได้ '+g.score+' คะแนน เดินทาง '+Math.floor(g.dist)+' เมตร';$('#learn').innerHTML='<b>สรุประบบ: '+levels[g.lvl][1]+'</b><br>'+levels[g.lvl][2].map((a,i)=>'• '+parts[i][0]+': '+a).join('<br>')}
function update(d){let p=g.p,ph=p.slide?48:p.h;p.vy+=1850*d;p.y+=p.vy*d;p.slide=Math.max(0,p.slide-d);if(p.y>=ground()-ph){p.y=ground()-ph;p.vy=0;p.j=0}g.dist+=g.speed*d*.06;g.speed=Math.min(520,285+g.dist*.17);if((g.card-=d)<0){card();g.card=2.1+Math.random()*.45}if((g.obs-=d)<0){obstacle();g.obs=3+Math.random()*1.2}es.forEach(e=>{e.x-=g.speed*d;if(e.t=='card')e.y+=Math.sin(performance.now()/450+e.ph)*18*d;let b={x:p.x+8,y:p.y+4,w:p.w-16,h:ph-8};if(!e.dead&&hit(b,e))e.t=='card'?take(e):hurt(e)});es=es.filter(e=>e.x+e.w>-80&&!e.dead);pt.forEach(a=>{a.x+=a.vx*d;a.y+=a.vy*d;a.vy+=650*d;a.l-=d});pt=pt.filter(a=>a.l>0);if(g.done>=2)finish(true);ui()}
function R(a,b,c,d,r,fill=true){x.beginPath();x.roundRect(a,b,c,d,r);fill?x.fill():x.stroke()}function draw(){let gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#53ccec');gr.addColorStop(.62,'#d5f9ff');gr.addColorStop(.63,'#72ce8a');gr.addColorStop(1,'#469561');x.fillStyle=gr;x.fillRect(0,0,W,H);let o=g?g.dist*6:0;for(let i=-o%180;i<W;i+=180){x.fillStyle='#4d60ad99';R(i,H*.48,115,ground()-H*.48,9);x.fillStyle='#c9f8ff';R(i+14,H*.52,87,40,5);x.fillStyle='#ffd94f';x.fillRect(i+50,H*.65,15,15);x.fillStyle='#49a46a';x.fillRect(i+140,H*.57,11,ground()-H*.57);x.beginPath();x.arc(i+145,H*.55,28,0,7);x.fill()}x.fillStyle='#3f955e';x.fillRect(0,ground(),W,H-ground());for(let i=-o%60;i<W;i+=60){x.fillStyle='#f8d756';R(i,ground()+15,31,7,3)}if(g){es.forEach(e=>{x.save();x.translate(e.x,e.y);if(e.t=='card'){x.fillStyle='#fffef7';R(0,0,e.w,e.h,16);x.strokeStyle=e.p[2];x.lineWidth=3;R(0,0,e.w,e.h,16,false);x.fillStyle=e.p[2];x.font='700 27px Kanit';x.textAlign='center';x.fillText(e.p[3],25,42);x.fillStyle='#293865';x.font='700 15px Kanit';x.fillText(e.p[0],90,30);x.fillStyle='#6e7897';x.font='12px Kanit';x.fillText(e.p[1],90,49)}else if(e.t=='box'){x.fillStyle='#87573c';R(0,0,e.w,e.h,5);x.strokeStyle='#ffd27e';x.beginPath();x.moveTo(4,4);x.lineTo(e.w-4,e.h-4);x.moveTo(e.w-4,4);x.lineTo(4,e.h-4);x.stroke()}else{x.fillStyle='#6976df';R(0,8,e.w,e.h-8,12);x.fillStyle='#d8fbff';R(15,0,e.w-30,18,6);x.fillStyle='#ffdf55';x.beginPath();x.arc(22,27,4,0,7);x.arc(e.w-22,27,4,0,7);x.fill()}x.restore()});let p=g.p,h=p.slide?48:p.h;x.save();x.translate(p.x,p.y);x.fillStyle='#593abc';R(8,h*.38,p.w-16,h*.5,14);x.fillStyle='#ffbd94';x.beginPath();x.arc(p.w*.56,h*.27,h*.23,0,7);x.fill();x.fillStyle='#252260';x.beginPath();x.arc(p.w*.56,h*.18,h*.25,3.14,0);x.lineTo(47,h*.24);x.fill();x.fillStyle='#25b8ed';R(19,h*.46,21,h*.16,4);x.strokeStyle='#203674';x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(18,h*.84);x.lineTo(p.slide?5:14,h+5);x.moveTo(40,h*.84);x.lineTo(p.slide?55:47,h+5);x.stroke();x.restore();pt.forEach(a=>{x.globalAlpha=a.l;x.fillStyle=a.c;x.beginPath();x.arc(a.x,a.y,4,0,7);x.fill()});x.globalAlpha=1}}function loop(t){if(!g.run)return;let d=Math.min(.032,(t-last)/1000);last=t;update(d);draw();if(g.run)raf=requestAnimationFrame(loop)}
$('#play').onclick=start;$('#jump').onclick=jump;$('#slide').onclick=slide;$('#mj').onclick=jump;$('#ms').onpointerdown=()=>slide(true);$('#ms').onpointerup=()=>slide(false);$('#pause').onclick=pause;$('#resume').onclick=pause;$('#go').onclick=()=>{$('#quiz').classList.add('hidden');g.run=true;last=performance.now();raf=requestAnimationFrame(loop)};$('#again').onclick=()=>{$('#result').classList.add('hidden');$('#start').classList.remove('hidden');levelsUI()};$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'};addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump()}if(e.code=='ArrowDown'){e.preventDefault();slide(true)}if(e.code=='Escape')pause()});addEventListener('keyup',e=>{if(e.code=='ArrowDown')slide(false)});C.onpointerdown=e=>{if(e.pointerType=='touch')jump()};levelsUI();$('#high').textContent=localStorage.techRunnerHigh||0;draw()})();
</script></body></html>
